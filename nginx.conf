server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript image/svg+xml application/xml;
  gzip_min_length 512;

  # Real 404s get the branded page (noindex) instead of nginx's default.
  error_page 404 /404.html;
  location = /404.html { internal; }

  # Liveness probe — served from memory, no filesystem hit, not in the access
  # log. Used by the container HEALTHCHECK and deploy/scripts/health.sh.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # /privacy and /privacy.html both resolve.
  location / { try_files $uri $uri.html $uri/ =404; }

  # AdMob app verification file — must stay plain text at the site root.
  location = /app-ads.txt { default_type text/plain; }

  location /assets/ { expires 7d; add_header Cache-Control "public"; }
}
